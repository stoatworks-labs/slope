  <body>
    <main id="demo">
      <noscript>
        <h1>Slope</h1>
        <p>
          An FFGL effect that runs every scan line of your clip through a
          one-bit delta modulator, the CVSD codec of military and Bluetooth
          voice: each sample sends one bit, saying above or below the decoder's
          guess. Hard edges arrive as ramps smeared along the scan (slope
          overload), flat areas get a fine two-sample dither (granular noise),
          an adaptive step trades one for the other, and a flipped bit knocks
          the rest of the line off as a streak that fades away on the leak.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/slope">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/slope/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/slope">Source on GitHub</a></li>
        </ul>
      </noscript>
